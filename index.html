<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toaleta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { font-size: 28px; color: #1C58B0; margin-bottom: 8px; }
        p { font-size: 16px; color: #666; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a {
            display: block;
            padding: 12px 24px;
            background: #1C58B0;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            transition: background 0.2s;
        }
        a:hover { background: #154a96; }
        .sub { font-size: 13px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Toaleta</h1>
        <p>Find public toilets near you</p>
        <div class="links">
            <a href="privacy-policy.html">Privacy Policy (English)</a>
            <a href="politica-confidentialitate.html">Politica de Confidențialitate (Română)</a>
            <a href="terms-of-use.html">Terms & Conditions (English)</a>
            <a href="termeni-si-conditii.html">Termeni și Condiții (Română)</a>
        </div>
        <p class="sub" style="margin-top: 24px;">© 2026 Toaleta App</p>
    </div>
</body>
</html>
